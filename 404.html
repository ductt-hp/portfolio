<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
        // Replace with your actual CloudFront domain or custom domain
        var targetDomain = "https://d2v6esn0lvhy24.cloudfront.net";
        
        // This grabs the exact subpage path the user tried to visit
        var currentPath = window.location.pathname;
        var currentSearch = window.location.search;
        
        // Instantly redirects them to the same path on CloudFront
        window.location.replace(targetDomain + currentPath + currentSearch);
    </script>
</head>
<body>
    <p>Redirecting you to our new site...</p>
</body>
</html>
